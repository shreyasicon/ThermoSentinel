AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ThermoSentinel API — API Gateway HTTP API + Lambda (ingest + sensor readings)

Globals:
  Function:
    Timeout: 29
    MemorySize: 512
    Runtime: nodejs20.x
    Architectures:
      - x86_64

Parameters:
  TursoDatabaseUrl:
    Type: String
    Default: ''
    Description: Optional Turso/libSQL URL (recommended for serverless)
  TursoAuthToken:
    Type: String
    Default: ''
    NoEcho: true
    Description: Optional Turso auth token
  RedisUrl:
    Type: String
    Default: ''
    Description: Optional REDIS_URL (reserved for future queue-based ingest)

Resources:
  ThermoHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - '*'
        AllowOrigins:
          - '*'
        MaxAge: 86400

  ThermoApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.handler
      CodeUri: ../../dist/lambda/
      Environment:
        Variables:
          TURSO_DATABASE_URL: !Ref TursoDatabaseUrl
          TURSO_AUTH_TOKEN: !Ref TursoAuthToken
          REDIS_URL: !Ref RedisUrl
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref ThermoHttpApi
            Path: /api/health
            Method: GET
        Ingest:
          Type: HttpApi
          Properties:
            ApiId: !Ref ThermoHttpApi
            Path: /api/ingest
            Method: POST
        SensorReadings:
          Type: HttpApi
          Properties:
            ApiId: !Ref ThermoHttpApi
            Path: /api/sensors/{type}/readings
            Method: GET

Outputs:
  HttpApiUrl:
    Description: Base URL — set Amplify env NEXT_PUBLIC_API_URL to this value (no trailing slash)
    Value: !Sub 'https://${ThermoHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  HttpApiId:
    Description: HTTP API ID
    Value: !Ref ThermoHttpApi
  FogIngestUrl:
    Description: Full URL for fog CLOUD_URL / ingest
    Value: !Sub 'https://${ThermoHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/api/ingest'
