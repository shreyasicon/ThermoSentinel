# ThermoSentinel static UI → API Gateway + Lambda + DynamoDB + SQS + SNS (backend deployed separately).
# Set env vars in Amplify Console → Hosting → Environment variables, then redeploy so NEXT_PUBLIC_* is baked in.
#
# AWS Lambda mode (default on *.amplifyapp.com when this is set at build):
#   NEXT_PUBLIC_LAMBDA_API_URL = CloudFormation HttpApiUrl (no trailing slash)
# Optional: NEXT_PUBLIC_API_URL (same), NEXT_PUBLIC_FOG_STATUS_URL (public fog /status if any)
#
# “Local API” from the hosted Amplify URL (dashboard → This PC): the browser must call a URL it can reach.
# Set NEXT_PUBLIC_LOCAL_API_URL to your tunnel, e.g. https://YOUR_SUBDOMAIN.ngrok-free.dev (no trailing slash).
# Update when the tunnel URL changes, then trigger a new build. Generate values: npm run amplify:env
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - npm ci
    build:
      commands:
        # Fails at runtime in the browser if NEXT_PUBLIC_LAMBDA_API_URL is missing — set it in Amplify Console.
        - npm run build:amplify
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
