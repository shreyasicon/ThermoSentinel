# ThermoSentinel static UI → API Gateway + Lambda + DynamoDB + SQS + SNS (backend deployed separately).
# Required env vars (set in Amplify Console → Hosting → Environment variables BEFORE builds):
#   NEXT_PUBLIC_LAMBDA_API_URL = CloudFormation output HttpApiUrl (no trailing slash)
# Optional: NEXT_PUBLIC_API_URL (same), NEXT_PUBLIC_FOG_STATUS_URL (public fog /status if any)
# Generate a copy-paste list: npm run amplify:env   (needs AWS CLI + deployed stack thermosentinel-api)
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - npm ci
    build:
      commands:
        # Fails at runtime in the browser if NEXT_PUBLIC_LAMBDA_API_URL is missing — set it in Amplify Console.
        - npm run build:amplify
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
