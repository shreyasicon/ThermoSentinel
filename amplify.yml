version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - npm ci
    build:
      commands:
        # Amplify Console → Environment variables (bake into client for "Lambda" toggle):
        #   NEXT_PUBLIC_LAMBDA_API_URL = https://xxx.execute-api.<region>.amazonaws.com/<stage>  (no trailing slash)
        # Legacy (still supported): NEXT_PUBLIC_API_URL = same base URL
        # Optional: NEXT_PUBLIC_LOCAL_API_URL if local Next is not on 127.0.0.1:3000
        # Static export uses trailingSlash (see next.config.mjs); middleware is skipped during this build script.
        - npm run build:amplify
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
